name: Notebook validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install exact binary dependencies
        run: >-
          python -m pip install --only-binary=:all: --requirement requirements.txt
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Run offline retrieval-contract tests
        run: python -m unittest discover -s tests -v
      - name: Execute notebook from the bundled snapshot
        run: >-
          python -m jupyter nbconvert
          --execute
          --to notebook
          --output executed.ipynb
          --output-dir /tmp
          --ExecutePreprocessor.timeout=180
          notebooks/chicago_food_inspections.ipynb

